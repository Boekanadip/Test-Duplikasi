[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-entity-resolution-lab"
version = "0.1.0"
description = "Research baseline for customer entity resolution and deduplication"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
splink = [
    "splink>=4,<5",
    "duckdb>=1,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["src*"]
